# Nodo camera autonomo ("client"): una camera, osservazioni ArUco via MQTT.
# Qui non c'e' ne' mosquitto ne' la rete `emerge-backplane`, cosi' lo stesso file
# vale sia per un nodo sul PC del server (broker raggiunto via host-gateway) sia
# per un nodo su un altro PC (broker raggiunto per IP sulla LAN).
#
#   make client CAMERA=cam_1                          broker sullo stesso PC
#   make client CAMERA=cam_1 MQTT_HOST=192.168.1.10    broker su un altro PC
name: emerge-vision-node

services:
  vision-node:
    build:
      context: .
    command:
      - vision-node
      - --camera
      - ${VISION_CAMERA:-cam_0}
      - --config
      - /app/config/config.local.json
      - --calibrations
      - /app/calibrations
      - --cache
      - /app/state/last_good_config.json
    environment:
      # Default: il broker gira sull'host di questo container (server e nodo sullo
      # stesso PC). Per un nodo remoto passare l'IP del PC che ospita il broker.
      VISION_MQTT_HOST: ${VISION_MQTT_HOST:-host.docker.internal}
      VISION_MQTT_PORT: ${VISION_MQTT_PORT:-1883}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Le camere USB sono device a caratteri V4L2 (major 81): montare /dev tiene
    # utilizzabili sia gli indici numerici sia i percorsi /dev/v4l/by-id/...
    device_cgroup_rules:
      - "c 81:* rmw"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - /dev:/dev
      - ./config.local.json:/app/config/config.local.json:ro
      - ./calibrations:/app/calibrations
      - node-diagnostics:/app/diagnostics
      - node-state:/app/state

volumes:
  node-diagnostics:
  node-state:
