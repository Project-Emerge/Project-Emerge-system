name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci-cd:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
    secrets: inherit
