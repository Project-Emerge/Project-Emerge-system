name: CI Pipeline

on:
  workflow_call:
  workflow_dispatch:

jobs:
  dashboard:
    name: Dashboard (TypeScript/React)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run dashboard tests
      run: npm test

    - name: Build dashboard
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dashboard-dist
        path: apps/dashboard/dist/
        retention-days: 1

  scala-runtime:
    name: Scala Runtime (SBT)
    defaults:
      run:
        working-directory: apps/aggregate-runtime
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'sbt'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: Compile Scala code
      run: sbt compile

    - name: Run Scala tests (if any)
      run: sbt test

    - name: Build assembly JAR
      run: sbt assembly

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v7
      with:
        name: scala-assembly
        path: apps/aggregate-runtime/target/scala-*/*-assembly-*.jar
        retention-days: 1

  python-vision:
    name: VisionSystem (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vision
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: apps/vision/uv.lock

    - name: Install OpenCV runtime libraries
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: uv sync --frozen

    - name: Run VisionSystem tests
      run: uv run --frozen pytest

  docker-builds:
    name: Docker Build Tests
    runs-on: ubuntu-latest
    needs: [dashboard, scala-runtime, python-vision]
    strategy:
      matrix:
        include:
          - component: dashboard
            context: .
          - component: aggregate-runtime
            context: apps/aggregate-runtime
          - component: vision
            context: apps/vision
          - component: robot-emulator
            context: apps/robot-emulator
          - component: neighborhood-system
            context: apps/neighborhood-system

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image for ${{ matrix.component }}
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ./apps/${{ matrix.component }}/Dockerfile
        push: false
        tags: test-${{ matrix.component }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  success:
    runs-on: ubuntu-latest
    needs: [dashboard, scala-runtime, python-vision, docker-builds, security-scan]
    if: always()

    steps:
    - name: Check CI Status
      run: |
        if [[ "${{ needs.dashboard.result }}" != "success" || \
              "${{ needs.scala-runtime.result }}" != "success" || \
              "${{ needs.python-vision.result }}" != "success" || \
              "${{ needs.docker-builds.result }}" != "success" || \
              ( "${{ needs.security-scan.result }}" != "success" && "${{ needs.security-scan.result }}" != "skipped" ) ]]; then
          echo "One or more CI jobs failed"
          exit 1
        else
          echo "All CI jobs passed successfully"
        fi
