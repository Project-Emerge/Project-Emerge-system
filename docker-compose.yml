services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0.22
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    restart: unless-stopped
    networks:
      - project-emerge-network

  dashboard:
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    container_name: project-emerge-dashboard
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app/dashboard
      - ./package.json:/app/package.json
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      - /app/dashboard/node_modules
    environment:
      - VITE_MQTT_BROKER_URL=ws://localhost:9001/mqtt
      - VITE_OFFLOADING_MANAGER_URL=http://localhost:8081
    depends_on:
      - mqtt-broker
    restart: unless-stopped
    networks:
      - project-emerge-network
    command: npm run dev -- --host 0.0.0.0

  edge-monitor:
    build:
      context: .
      dockerfile: ./edge-monitor/Dockerfile
    container_name: project-emerge-edge-monitor
    ports:
      - "5174:5174"
    volumes:
      - ./edge-monitor:/app
      - /app/node_modules
    environment:
      - VITE_MQTT_BROKER_URL=ws://localhost:9001/mqtt
    depends_on:
      - mqtt-broker
    restart: unless-stopped
    networks:
      - project-emerge-network
    command: npm run dev -- --host 0.0.0.0

  aruco-detector:
    build:
      context: .
      dockerfile: ./aruco-detector/Dockerfile
    container_name: project-emerge-aruco-detector
    volumes:
      - ./aruco-detector:/app/src
      - /dev/video0:/dev/video0
    devices:
      - /dev/video0:/dev/video0
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - MQTT_URL=mqtt-broker
      - PYTHONPATH=/app:/app/src
    depends_on:
      - mqtt-broker
    restart: unless-stopped
    networks:
      - project-emerge-network
    command: uv run -- python src/main.py --mqtt-url mqtt-broker --width 1920 --height 1080

  aggregate-runtime:
    build:
      context: .
      dockerfile: ./aggregate-runtime/Dockerfile
    container_name: project-emerge-aggregate-runtime
    environment:
      - MQTT_URL=tcp://mqtt-broker:1883
      - OFFLOADING_MANAGER_HOST=offloading-manager
      - OFFLOADING_MANAGER_PORT=8000
    depends_on:
      - mqtt-broker
      - offloading-manager
    restart: unless-stopped
    networks:
      - project-emerge-network

  neighborhood-system:
    build:
      context: .
      dockerfile: ./neighborhood-system/Dockerfile
    container_name: project-emerge-neighborhood-system
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
    depends_on:
      - mqtt-broker
    restart: unless-stopped
    networks:
      - project-emerge-network
    ports:
      - "5001:5000"

  offloading-manager:
      build:
        context: ./offloading-manager
        dockerfile: Dockerfile
      container_name: project-emerge-offloading-manager
      ports:
        - "8081:8000"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
      networks:
        - project-emerge-network
      environment:
        - CONTAINERS_NETWORK=project-emerge-network
        - CONTAINERS_POLLING_INTERVAL=5
        - ROBOT_RESPONSE_TIMEOUT=10
        # only_delete (default) handles the robot WebSocket handshake: a connected robot can request
        # offloading (self), and the manager can ask the robot to (de)offload. The edge runtime
        # connects as such a robot. `direct` is for MQTT-only robots that never open a robot socket.
        - DECISION_MODULE=only_delete
        # High thresholds keep the demo manual (the stress monitor won't auto-withdraw offloading);
        # lower them to see the manager hand a robot back to its edge runtime under load.
        - ONLY_DELETE_DECISION_MAX_CPU=100000
        - ONLY_DELETE_DECISION_MAX_MEMORY=100000
      depends_on:
        - mqtt-broker
      restart: unless-stopped


networks:
  project-emerge-network:
    # Stable, unprefixed name so standalone containers (e.g. the edge runtime image) can join with
    # `--network project-emerge-network`.
    name: project-emerge-network
    driver: bridge

volumes:
  mqtt-data:
  mqtt-log:
