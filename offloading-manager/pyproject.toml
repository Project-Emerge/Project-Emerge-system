[project]
name = "offloading-manager"
authors = [
    { name = "Lorenzo Rossi", email = "lorenzo.rossi50@studio.unibo.it" }
]
version = "0.1.0"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiodocker>=0.26.0",
    "asyncio>=4.0.0",
    "fastapi[standard]>=0.135.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
 
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
 
[tool.fastapi]
entrypoint = "offloading_manager.main:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"